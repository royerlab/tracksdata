---
repos:
# basic pre-commit
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-yaml
        files: \.yaml$|\.yml$
        args: [--unsafe]
      - id: check-toml
        files: \.toml$

  # make every import absolute
  - repo: https://github.com/MarcoGorelli/absolufy-imports
    rev: v0.3.0
    hooks:
      - id: absolufy-imports

  # linting, import sorting (ruff "I") and formatting
  # NOTE: ruff-format is the single formatter here; do not add black/isort back,
  # they disagree with it (magic trailing comma, string quotes, import grouping)
  # and CI only runs `ruff check` + `ruff format --check`.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.0
    hooks:
      # Run the linter.
      - id: ruff
        types_or: [python, pyi, jupyter, markdown]
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi, jupyter, markdown]
